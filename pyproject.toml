[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyhaystack-async"
version = "4.1.0"
description = "Async Python client for Project Haystack servers"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Christian Tremblay" },
]
keywords = ["haystack", "hvac", "building-automation", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Framework :: AsyncIO",
]
dependencies = [
    "httpx>=0.27",
    "hszinc @ git+https://github.com/jec-jedi/hszinc.git@fast-parse",
    "pandas>=1.5",
    "iso8601>=2.0",
    "pytz",
    "certifi",
    "semver>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
    "mypy>=1.10",
    "respx>=0.22",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyhaystack_async"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
